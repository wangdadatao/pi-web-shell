<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pi-web-shell</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥧</text></svg>" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="folders" class="pane">
        <div class="pane-head">
          <span>文件夹</span>
          <span class="head-actions">
            <button id="new-folder" class="icon-btn" title="在指定文件夹新建会话">＋</button>
            <button id="refresh" class="icon-btn" title="刷新">⟳</button>
          </span>
        </div>
        <div id="folder-list" class="list"></div>
      </aside>

      <aside id="sessions" class="pane">
        <div class="pane-head">
          <span id="sessions-title">会话</span>
          <button id="new-session" class="icon-btn" title="在此文件夹新建会话">＋</button>
        </div>
        <div id="session-list" class="list"></div>
      </aside>

      <main id="chat">
        <header id="chat-head">
          <div class="chat-head-main">
            <div id="chat-title">选择一个会话</div>
            <div id="chat-meta" class="muted"></div>
          </div>
          <div class="chat-head-actions">
            <span id="sidebar-crumb" class="crumb" title=""></span>
            <button id="sidebar-toggle" class="icon-btn" title="折叠侧栏">‹</button>
            <span id="status" class="status idle"></span>
            <button id="abort" class="ghost-btn" disabled>停止</button>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <div id="drop-hint" class="drop-hint hidden">松手即可添加图片</div>

        <footer id="composer">
          <div id="attachments" class="attachments"></div>
          <div class="composer-row">
            <button id="attach" class="icon-btn" title="添加图片">🖼</button>
            <textarea id="input" rows="1" placeholder="输入消息…（Enter 发送，Shift+Enter 换行，可直接粘贴/拖拽图片）"></textarea>
            <button id="send">发送</button>
          </div>
          <input id="file" type="file" accept="image/*" multiple hidden />
        </footer>

        <div id="stats" class="stats-bar empty">
          <div id="stats-items" class="stats-items"></div>
          <div id="stats-actions" class="stats-actions" hidden>
            <select id="model-select" class="stat-select" title="切换模型" aria-label="切换模型" hidden></select>
            <select id="thinking-select" class="stat-select" title="调整思考等级" aria-label="调整思考等级" hidden></select>
          </div>
        </div>
      </main>
    </div>
    <script>
      // Load Prism as a classic script but stop it from auto-highlighting:
      // every code block is highlighted explicitly when it is rendered.
      window.Prism = { manual: true };
    </script>
    <script src="/vendor/prism.js"></script>
    <script src="/vendor/prism-languages.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
